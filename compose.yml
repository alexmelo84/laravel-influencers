services:
  api:
    container_name: laravel-influencers
    stdin_open: true
    tty: true
    build: .
    ports:
      - 8000:80
    working_dir: /var/www/html
    depends_on:
      - bd
    volumes: 
      - ./api:/var/www/html
    environment:
      APP_UID: "1002"
      APP_GID: "1002"
  bd:
    image: mysql
    container_name: db-laravel-influencers
    restart: always
    ports:
      - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: 123456
    volumes:
      - laravel-influencers-db:/var/lib/mysql
volumes:
  laravel-influencers-db:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${PWD}/db
